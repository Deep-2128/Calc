<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mortgage Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }

    h1 {
      font-family: 'League Spartan', sans-serif;
      font-weight: 700;
      color: #22b14c;
      font-size: 1.8rem;
      text-align: left;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix, .suffix {
      position: absolute;
      color: #a0aec0;
      font-weight: 600;
      font-size: 1rem;
    }

    .prefix { left: 12px; }
    .suffix { right: 12px; }

    input, select {
      width: 100%;
      height: 48px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #2d3748;
      padding: 0 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input.has-prefix { padding-left: 28px; }
    input.has-suffix { padding-right: 42px; }

    input:focus, select:focus {
      border-color: #22b14c;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .results-card {
      background-color: #22b14c;
      color: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .results-card .monthly-title {
      font-size: 0.85rem;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .results-card .monthly-amount {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 8px 0 16px 0;
    }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding-top: 12px;
      font-size: 0.8rem;
    }

    .breakdown div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .breakdown span.val {
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>Mortgage Calculator</h1>

    <div class="input-group">
      <label for="homePrice">Home Price</label>
      <div class="input-wrapper">
        <span class="prefix">$</span>
        <input type="number" id="homePrice" class="has-prefix" value="400000" oninput="calculateMortgage()">
      </div>
    </div>

    <div class="input-group">
      <label for="downPayment">Down Payment</label>
      <div class="input-wrapper">
        <span class="prefix">$</span>
        <input type="number" id="downPayment" class="has-prefix" value="80000" oninput="calculateMortgage()">
      </div>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label for="interestRate">Interest Rate</label>
        <div class="input-wrapper">
          <input type="number" id="interestRate" class="has-suffix" step="0.1" value="6.5" oninput="calculateMortgage()">
          <span class="suffix">%</span>
        </div>
      </div>

      <div class="input-group">
        <label for="loanTerm">Loan Term</label>
        <div class="input-wrapper">
          <input type="number" id="loanTerm" class="has-suffix" value="30" min="1" step="1" oninput="calculateMortgage()">
          <span class="suffix">yrs</span>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label for="propertyTax">Property Tax (/yr)</label>
        <div class="input-wrapper">
          <span class="prefix">$</span>
          <input type="number" id="propertyTax" class="has-prefix" value="4800" oninput="calculateMortgage()">
        </div>
      </div>

      <div class="input-group">
        <label for="homeInsurance">Insurance (/yr)</label>
        <div class="input-wrapper">
          <span class="prefix">$</span>
          <input type="number" id="homeInsurance" class="has-prefix" value="1200" oninput="calculateMortgage()">
        </div>
      </div>
    </div>

    <div class="input-group">
      <label for="hoa">HOA Fees (/mo)</label>
      <div class="input-wrapper">
        <span class="prefix">$</span>
        <input type="number" id="hoa" class="has-prefix" value="0" oninput="calculateMortgage()">
      </div>
    </div>

    <div class="results-card">
      <div class="monthly-title">Total Monthly Payment</div>
      <div class="monthly-amount" id="totalMonthly">$0.00</div>
      
      <div class="breakdown">
        <div>
          <span>Principal & Interest</span>
          <span class="val" id="principalInterest">$0.00</span>
        </div>
        <div>
          <span>Taxes & Insurance</span>
          <span class="val" id="taxesInsurance">$0.00</span>
        </div>
        <div>
          <span>Loan Amount</span>
          <span class="val" id="loanAmount">$0.00</span>
        </div>
        <div>
          <span>Total Interest</span>
          <span class="val" id="totalInterest">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function formatCurrency(num) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    }

    function calculateMortgage() {
      const homePrice = parseFloat(document.getElementById('homePrice').value) || 0;
      const downPayment = parseFloat(document.getElementById('downPayment').value) || 0;
      const annualRate = parseFloat(document.getElementById('interestRate').value) || 0;
      const years = parseFloat(document.getElementById('loanTerm').value) || 0;
      const propertyTaxYr = parseFloat(document.getElementById('propertyTax').value) || 0;
      const homeInsuranceYr = parseFloat(document.getElementById('homeInsurance').value) || 0;
      const hoaMo = parseFloat(document.getElementById('hoa').value) || 0;

      const principal = Math.max(0, homePrice - downPayment);
      const months = years * 12;
      const monthlyRate = (annualRate / 100) / 12;

      let monthlyPI = 0;
      let totalInterest = 0;

      if (principal > 0 && months > 0) {
        if (monthlyRate === 0) {
          monthlyPI = principal / months;
          totalInterest = 0;
        } else {
          monthlyPI = (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
          totalInterest = (monthlyPI * months) - principal;
        }
      }

      const monthlyTax = propertyTaxYr / 12;
      const monthlyInsurance = homeInsuranceYr / 12;
      const monthlyTaxesAndIns = monthlyTax + monthlyInsurance + hoaMo;
      const totalMonthlyPayment = monthlyPI + monthlyTaxesAndIns;

      document.getElementById('totalMonthly').innerText = formatCurrency(totalMonthlyPayment);
      document.getElementById('principalInterest').innerText = formatCurrency(monthlyPI);
      document.getElementById('taxesInsurance').innerText = formatCurrency(monthlyTaxesAndIns);
      document.getElementById('loanAmount').innerText = formatCurrency(principal);
      document.getElementById('totalInterest').innerText = formatCurrency(totalInterest);
    }

    // Initial calculation
    calculateMortgage();
  </script>
</body>
</html>
